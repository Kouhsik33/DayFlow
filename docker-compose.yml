services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: trash-frontend

    ports:
      - "3001:3001"

    volumes:
      - .:/app
      - trash_node_modules:/app/node_modules

    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - CHOKIDAR_USEPOLLING=true

    stdin_open: true
    tty: true

volumes:
  trash_node_modules: